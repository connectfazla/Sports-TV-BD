name: sports_tv_bd
description: Sports TV BD - Live IPTV & Sports Streaming for Bangladesh
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.5.0+1
  http: ^1.2.2

  # Video
  better_player_plus: ^1.3.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  firebase_database: ^11.1.0

  # Local storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.2.7

  # Ads
  google_mobile_ads: ^5.1.0

  # Utilities
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  crypto: ^3.0.5
  encrypt: ^5.0.3
  url_launcher: ^6.3.0
  open_file_plus: ^3.4.1+1
  path_provider: ^2.1.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
