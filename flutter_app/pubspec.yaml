name: sports_tv_bd
description: Sports TV BD - Live IPTV & Sports Streaming for Bangladesh
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0-dev.3
  riverpod_annotation: ^3.0.0-dev.3

  # Networking
  dio: ^5.5.0+1
  http: ^1.2.2

  # Video
  better_player_plus: ^1.3.0

  # Firebase
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  firebase_database: ^12.4.2

  # Local storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1

  # Navigation
  go_router: ^17.3.0

  # Ads
  google_mobile_ads: ^8.0.0

  # Utilities
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  connectivity_plus: ^7.1.1
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  crypto: ^3.0.5
  encrypt: ^5.0.3
  url_launcher: ^6.3.0
  open_filex: ^4.7.0
  path_provider: ^2.1.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^3.0.0-dev.11
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
