server {
    listen 80;
    server_name api.sports-tv.bd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.sports-tv.bd;

    ssl_certificate     /etc/letsencrypt/live/sports-tv.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sports-tv.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    location /validate-stream {
        internal;
        proxy_pass http://backend:3001/api/v1/auth/validate-stream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /live/ {
        auth_request /validate-stream;
        proxy_pass http://stream-origin/;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
